<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status Browser Muse</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; color: #e8e8e8; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; padding: 14px; }
  .card { max-width: 520px; margin: 0 auto; border: 1px solid #222; border-radius: 16px; overflow: hidden; background: #0b0b0b; }
  .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #222; }
  .dot { width: 34px; height: 34px; border-radius: 50%; background: #0e3b2e; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .head h1 { font-size: 17px; }
  .head small { color: #888; font-size: 12px; display: block; margin-top: 2px; }
  .pill { margin-left: auto; font-weight: 700; font-size: 11px; padding: 4px 10px; border-radius: 20px; background: #333; color: #ccc; white-space: nowrap; }
  .pill.on { background: #00c853; color: #000; }
  .body { padding: 14px 16px; }
  .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin: 12px 0 4px; }
  .label:first-child { margin-top: 0; }
  .big { font-size: 16px; font-weight: 700; line-height: 1.4; word-break: break-word; }
  .big a { color: #4dd0a6; text-decoration: none; }
  .muted { color: #999; font-size: 13px; line-height: 1.5; word-break: break-word; }
  .task { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #161616; font-size: 13px; }
  .task:last-child { border-bottom: none; }
  .task .st { color: #888; white-space: nowrap; }
  .task .st.on { color: #00e676; }
  .clock { text-align: center; padding: 10px; font-size: 12px; color: #9be7c4; border-top: 1px solid #222; font-variant-numeric: tabular-nums; }
  .err { color: #ff8a80; font-size: 13px; text-align: center; padding: 8px; display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="dot">🌐</div>
    <div><h1>Status Browser Muse</h1><small>Apa yang sedang browser Muse kerjakan</small></div>
    <div class="pill" id="pill">…</div>
  </div>
  <div class="body">
    <div class="label">Halaman saat ini</div>
    <div class="big" id="title">Memuat…</div>
    <div class="muted" id="url"></div>
    <div class="label">Aktivitas</div>
    <div class="muted" id="activity">—</div>
    <div class="label">Tugas terakhir</div>
    <div id="tasks"></div>
  </div>
  <div class="err" id="err">Tidak bisa memuat status — periksa koneksi lalu refresh.</div>
  <div class="clock">🕐 <span id="clock">--:--:--</span> WIB &middot; Diperbarui <span id="updated">—</span> &middot; Refresh otomatis 30 detik</div>
</div>
<script>
function tick(){
  var d = new Date(Date.now() + (7*60 + new Date().getTimezoneOffset())*60000);
  var p = function(n){ return String(n).padStart(2,'0'); };
  document.getElementById('clock').textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
tick(); setInterval(tick, 1000);
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function load(){
  fetch('status.json?t=' + Date.now()).then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); }).then(function(s){
    document.getElementById('err').style.display = 'none';
    var pill = document.getElementById('pill');
    if (s.state === 'working') { pill.textContent = '● SEDANG BEKERJA'; pill.className = 'pill on'; }
    else { pill.textContent = '○ IDLE'; pill.className = 'pill'; }
    document.getElementById('title').innerHTML = s.current_url
      ? '<a href="' + esc(s.current_url) + '" target="_blank" rel="noopener">' + esc(s.current_title || s.current_url) + '</a>'
      : esc(s.current_title || '—');
    document.getElementById('url').textContent = s.current_url || '';
    document.getElementById('activity').textContent = s.activity || 'Tidak ada aktivitas';
    document.getElementById('updated').textContent = s.updated_at_wib || '—';
    var html = '';
    (s.tasks || []).forEach(function(t){
      html += '<div class="task"><div>' + esc(t.title) + '</div><div class="st' + (t.state === 'working' ? ' on' : '') + '">' + esc(t.state === 'working' ? 'berjalan' : (t.state || '')) + (t.time ? ' · ' + esc(t.time) : '') + '</div></div>';
    });
    document.getElementById('tasks').innerHTML = html || '<div class="muted">Belum ada tugas.</div>';
  }).catch(function(){
    document.getElementById('err').style.display = 'block';
  });
}
load(); setInterval(load, 30000);
</script>
</body>
</html>
